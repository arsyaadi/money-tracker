<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid Dark Background -->
  <rect width="1024" height="1024" fill="#09090b"/>
  
  <defs>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Precision Geometric Financial Ledger Symbol -->
  <!-- Top Ledger Bar -->
  <rect x="272" y="300" width="480" height="72" rx="20" fill="url(#glyphGrad)"/>
  <!-- Middle Ledger Bar -->
  <rect x="272" y="440" width="480" height="72" rx="20" fill="url(#glyphGrad)"/>
  <!-- Bottom Ledger Bar -->
  <rect x="272" y="580" width="300" height="72" rx="20" fill="url(#glyphGrad)"/>
  <!-- Emerald Financial Accent Coin -->
  <circle cx="682" cy="616" r="48" fill="url(#accentGrad)"/>
</svg>
