name: Build Android APK

on:
  push:
    branches: [ main, feat/tauri-mobile ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set Android Environment Variables
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Initialize Tauri Android
        run: npx tauri android init

      - name: Build Android Release APK
        run: npx tauri android build --apk

      - name: Generate Keystore and Sign APK
        run: |
          keytool -genkey -v -keystore release.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MoneyTracker,O=MoneyTracker,C=ID"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools from: $BUILD_TOOLS_DIR"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          mkdir -p signed-apk
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk"); do
            filename=$(basename "$apk" -unsigned.apk)
            aligned_apk="signed-apk/${filename}-aligned.apk"
            final_apk="signed-apk/${filename}-signed.apk"

            if [ -f "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$apk" "$aligned_apk"
              $APKSIGNER sign --ks release.jks --ks-pass pass:android --ks-key-alias release --key-pass pass:android --out "$final_apk" "$aligned_apk"
              rm -f "$aligned_apk"
            else
              $APKSIGNER sign --ks release.jks --ks-pass pass:android --ks-key-alias release --key-pass pass:android --out "$final_apk" "$apk"
            fi
            echo "Successfully signed: $final_apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-tracker-apk
          path: signed-apk/*.apk
          if-no-files-found: error
